[package]
name = "hokun"
version = "0.0.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = "4.6.7"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
toasty = { version = "0.11.0", features = ["migration", "sqlite"] }
toasty-cli = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.10.0", features = [
    "font-fontsource",
    "icon-iconify",
    "tailwind",
    "ui",
] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }
