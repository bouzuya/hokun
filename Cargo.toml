[package]
name = "hokun"
version = "0.0.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.10.0", features = [
    "font-fontsource",
    "tailwind",
    "ui",
] }
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = [
    "tailwind",
] }
